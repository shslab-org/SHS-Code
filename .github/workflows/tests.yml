name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-xdist httpx

      - name: Show environment
        run: |
          python --version
          python -c "import app; print('SHS-Code', app.__version__)"

      - name: Run test suite
        env:
          APP_ENV: test
        run: |
          python -m pytest

      - name: Test summary
        if: always()
        run: echo "pytest finished on python ${{ matrix.python-version }}"
